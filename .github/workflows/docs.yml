# Builds the Doxygen documentation and uploads it as a downloadable
# workflow artifact (Actions -> Docs -> latest run -> "docs-html").
# GitHub Pages is not used because it needs a paid plan for private repos.
name: Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Doxygen
        run: sudo apt-get update && sudo apt-get install -y doxygen graphviz
      - name: Generate docs
        working-directory: docs
        run: doxygen Doxyfile
      - uses: actions/upload-artifact@v4
        with:
          name: docs-html
          path: docs/html
          retention-days: 90
