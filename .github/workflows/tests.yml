# Runs the portable unit tests (code that does not need Windows, the GUI or the machine).
name: Tests

on:
  push:
    branches: [main, claude]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ring buffer (ThreadSanitizer)
        run: |
          g++ -std=c++17 -O1 -g -Wall -Wextra -Werror -fsanitize=thread -pthread \
            -I main/LloydLR10KTensile tests/ring_buffer_test.cpp -o ring_buffer_tsan
          ./ring_buffer_tsan
      - name: Ring buffer (AddressSanitizer + UBSan)
        run: |
          g++ -std=c++17 -O1 -g -Wall -Wextra -Werror -fsanitize=address,undefined -pthread \
            -I main/LloydLR10KTensile tests/ring_buffer_test.cpp -o ring_buffer_asan
          ./ring_buffer_asan
      - name: Material property formulas
        run: |
          g++ -std=c++17 -O1 -g -Wall -Wextra -Werror -fsanitize=address,undefined \
            -I main/LloydLR10KTensile tests/material_calc_test.cpp -o material_calc_test
          ./material_calc_test
      - name: LR 10K protocol (decoding/encoding, identical to the original code)
        run: |
          g++ -std=c++17 -O1 -g -Wall -Wextra -Werror -fsanitize=address,undefined \
            -I main/LloydLR10KTensile tests/protocol_test.cpp main/LloydLR10KTensile/LR10KBufferMessage.cpp -o protocol_test
          ./protocol_test
      - name: Serial reader thread with a fake port (ThreadSanitizer)
        run: |
          g++ -std=c++17 -O1 -g -Wall -Wextra -Werror -fsanitize=thread -pthread \
            -I main/LloydLR10KTensile tests/serial_reader_test.cpp -o serial_reader_test
          ./serial_reader_test
      - name: Machine (reader + interpreter threads) with a fake port (ThreadSanitizer)
        run: |
          g++ -std=c++17 -O1 -g -Wall -Wextra -Werror -fsanitize=thread -pthread \
            -I main/LloydLR10KTensile tests/machine_test.cpp -o machine_test
          ./machine_test
      - name: Serial traffic log (write, read back, replay; ThreadSanitizer)
        run: |
          g++ -std=c++17 -O1 -g -Wall -Wextra -Werror -fsanitize=thread -pthread \
            -I main/LloydLR10KTensile tests/serial_traffic_log_test.cpp -o serial_traffic_log_test
          ./serial_traffic_log_test
      - name: Connect sequence replayed against a recorded LR 10K session (ThreadSanitizer)
        run: |
          g++ -std=c++17 -O1 -g -Wall -Wextra -Werror -fsanitize=thread -pthread \
            -I main/LloydLR10KTensile tests/connect_replay_test.cpp -o connect_replay_test
          ./connect_replay_test
      - name: Measurement (load/extension with zero point)
        run: |
          g++ -std=c++17 -O1 -g -Wall -Wextra -Werror -fsanitize=address,undefined -pthread \
            -I main/LloydLR10KTensile tests/measurement_test.cpp -o measurement_test
          ./measurement_test
      - name: Calculations for one test (same results as the old calculator)
        run: |
          g++ -std=c++17 -O1 -g -Wall -Wextra -Werror -fsanitize=address,undefined \
            -I main/LloydLR10KTensile tests/test_calc_test.cpp -o test_calc_test
          ./test_calc_test
      - name: Test data (smoothing, snapping, UTS, point list, travel limit)
        run: |
          g++ -std=c++17 -O1 -g -Wall -Wextra -Werror -fsanitize=address,undefined \
            -I main/LloydLR10KTensile tests/test_data_test.cpp -o test_data_test
          ./test_data_test
      - name: Automatic E-modulus limits, Rp0.2 and proportional limit
        run: |
          g++ -std=c++17 -O1 -g -Wall -Wextra -Werror -fsanitize=address,undefined \
            -I main/LloydLR10KTensile tests/auto_points_test.cpp -o auto_points_test
          ./auto_points_test
      - name: Excel export numbers (same as the old export)
        run: |
          g++ -std=c++17 -O1 -g -Wall -Wextra -Werror -fsanitize=address,undefined \
            -I main/LloydLR10KTensile tests/excel_report_test.cpp -o excel_report_test
          ./excel_report_test
      - name: Machine status for the GUI (ThreadSanitizer)
        run: |
          g++ -std=c++17 -O1 -g -Wall -Wextra -Werror -fsanitize=thread -pthread \
            -I main/LloydLR10KTensile tests/status_test.cpp -o status_test
          ./status_test
      - name: Load safety (50 N blocker, load limit)
        run: |
          g++ -std=c++17 -O1 -g -Wall -Wextra -Werror -fsanitize=address,undefined \
            -I main/LloydLR10KTensile tests/load_safety_test.cpp -o load_safety_test
          ./load_safety_test
      - name: Optical extensometer smoothing
        run: |
          g++ -std=c++17 -O1 -g -Wall -Wextra -Werror -fsanitize=address,undefined \
            -I main/LloydLR10KTensile tests/extensometer_filter_test.cpp -o extensometer_filter_test
          ./extensometer_filter_test
      - name: Optical extensometer marker tracking
        run: |
          g++ -std=c++17 -O1 -g -Wall -Wextra -Werror -fsanitize=address,undefined \
            -I main/LloydLR10KTensile tests/extensometer_tracking_test.cpp -o extensometer_tracking_test
          ./extensometer_tracking_test
      - name: Extensometer marker colour from a click (eyedropper)
        run: |
          g++ -std=c++17 -O1 -g -Wall -Wextra -Werror -fsanitize=address,undefined \
            -I main/LloydLR10KTensile tests/marker_colour_pick_test.cpp -o marker_colour_pick_test
          ./marker_colour_pick_test
      - name: Optical extensometer sub-pixel marker centre
        run: |
          g++ -std=c++17 -O1 -g -Wall -Wextra -Werror -fsanitize=address,undefined \
            -I main/LloydLR10KTensile tests/extensometer_centroid_test.cpp -o extensometer_centroid_test
          ./extensometer_centroid_test
      - name: Extensometer camera resolution (working size, rectangles, recording size)
        run: |
          g++ -std=c++17 -O1 -g -Wall -Wextra -Werror -fsanitize=address,undefined \
            -I main/LloydLR10KTensile tests/camera_resolution_test.cpp -o camera_resolution_test
          ./camera_resolution_test
      - name: Settings file name (and moving the old v..._lr10k.ini)
        run: |
          g++ -std=c++17 -O1 -g -Wall -Wextra -Werror -fsanitize=address,undefined \
            -I main/LloydLR10KTensile tests/settings_file_test.cpp -o settings_file_test
          ./settings_file_test
      - name: Theme colours (WCAG contrast of every text/background pair)
        run: |
          g++ -std=c++17 -O1 -g -Wall -Wextra -Werror -fsanitize=address,undefined \
            -I main/LloydLR10KTensile tests/theme_palette_test.cpp -o theme_palette_test
          ./theme_palette_test
      - name: Theme previews build (tools/theme_preview.cpp)
        run: |
          g++ -std=c++17 -O1 -I . -I main/LloydLR10KTensile tools/theme_preview.cpp \
            imgui.cpp imgui_draw.cpp imgui_tables.cpp imgui_widgets.cpp implot.cpp implot_items.cpp -o theme_preview
          mkdir -p theme-previews && ./theme_preview theme-previews
      - name: Default window layout (the real Dear ImGui, headless)
        run: |
          g++ -std=c++17 -O1 -I . -I main/LloydLR10KTensile tests/default_layout_check.cpp \
            imgui.cpp imgui_draw.cpp imgui_tables.cpp imgui_widgets.cpp -o default_layout_check
          ./default_layout_check
      - name: Graph calls with the real ImPlot and Dear ImGui (headless, AddressSanitizer)
        run: |
          # -O0: ImPlot's templates take minutes to compile with sanitizers and optimisation
          g++ -std=c++17 -O0 -g -fsanitize=address -I . tests/implot_smoke_check.cpp \
            imgui.cpp imgui_draw.cpp imgui_tables.cpp imgui_widgets.cpp implot.cpp implot_items.cpp -o implot_smoke_check
          ./implot_smoke_check
      - name: Autosave (file names, when to write, writer thread; ThreadSanitizer)
        run: |
          g++ -std=c++17 -O1 -g -Wall -Wextra -Werror -fsanitize=thread \
            -I main/LloydLR10KTensile tests/autosave_test.cpp -o autosave_test
          ./autosave_test
      - name: Crash report text and last console lines (ThreadSanitizer)
        run: |
          g++ -std=c++17 -O1 -g -Wall -Wextra -Werror -fsanitize=thread \
            -I main/LloydLR10KTensile tests/crash_report_test.cpp -o crash_report_test
          ./crash_report_test

  extensometer-opencv:
    # The extensometer's marker detection with the real OpenCV, on drawn camera frames from 800 x 600 to 4K
    # (old vs new: strain error and time per frame)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install OpenCV
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libopencv-dev
      - name: Check the marker centres
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -I main/LloydLR10KTensile tests/extensometer_pipeline_check.cpp \
            -o extensometer_pipeline_check $(pkg-config --cflags --libs opencv4)
          ./extensometer_pipeline_check

  excel-files:
    # Writes sample .xlsx reports with the real libxlsxwriter and checks them with openpyxl
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install libxlsxwriter and openpyxl
        run: |
          sudo apt-get update
          sudo apt-get install -y libxlsxwriter-dev
          pip install openpyxl
      - name: Write sample reports
        run: |
          g++ -std=c++20 -O1 -g -Wall -Wextra -fsanitize=address,undefined \
            -I main/LloydLR10KTensile tests/excel_writer_check.cpp main/LloydLR10KTensile/ExcelWriter.cpp \
            -lxlsxwriter -o excel_writer_check
          mkdir -p excel-samples
          ./excel_writer_check excel-samples
      - name: Check the reports
        run: python3 tests/check_excel_reports.py excel-samples
      - name: Upload the sample reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: excel-sample-reports
          path: excel-samples/

  sysml-model:
    # Compiles the SysML v2 architecture model (docs/architecture/lr10k.sysml) with the SysML v2 Pilot
    # Implementation, the reference compiler, and its standard library. Fails on any error or warning.
    runs-on: ubuntu-latest
    env:
      KERNEL_VERSION: 0.59.0
      KERNEL_RELEASE: 2026-04
    steps:
      - uses: actions/checkout@v4
      - name: SysML v2 standard library (pinned commit)
        uses: actions/checkout@v4
        with:
          repository: Systems-Modeling/SysML-v2-Release
          ref: 9baca5908ca28b53da085de69336fde48420ea8f
          path: sysml-v2-release
          sparse-checkout: sysml.library
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Cache the SysML v2 Pilot kernel
        uses: actions/cache@v4
        with:
          path: ~/sysml-kernel
          key: sysml-kernel-${{ env.KERNEL_VERSION }}
      - name: Download the SysML v2 Pilot kernel
        run: |
          jar=~/sysml-kernel/jupyter-sysml-kernel-$KERNEL_VERSION-all.jar
          if [ ! -f "$jar" ]; then
            mkdir -p ~/sysml-kernel
            curl -fL --retry 3 --no-progress-meter -o /tmp/kernel.zip \
              "https://github.com/Systems-Modeling/SysML-v2-Pilot-Implementation/releases/download/$KERNEL_RELEASE/jupyter-sysml-kernel-$KERNEL_VERSION.zip"
            unzip -q -j /tmp/kernel.zip "sysml/jupyter-sysml-kernel-$KERNEL_VERSION-all.jar" -d ~/sysml-kernel
          fi
          ls -l "$jar"
      - name: Check docs/architecture/lr10k.sysml
        run: |
          set -o pipefail   # the checker's exit code, not grep's
          jar=~/sysml-kernel/jupyter-sysml-kernel-$KERNEL_VERSION-all.jar
          javac -cp "$jar" -d sysml-check-classes tools/sysml-check/CheckSysml.java
          java -cp "$jar:sysml-check-classes" CheckSysml sysml-v2-release/sysml.library docs/architecture/lr10k.sysml \
            | grep -v '^Reading '
